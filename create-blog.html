<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog | BlogSpace</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body data-page="create-blog">

    <header class="navbar">
        <a href="index.html" class="logo">BlogSpace<span>.</span></a>
        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <button class="nav-link-button" id="logoutButton">Logout</button>
        </nav>
    </header>

    <main class="form-section">
        <form class="blog-form" id="createBlogForm">
            <p class="eyebrow">SHARE YOUR THOUGHTS</p>
<h1 id="formHeading">Create a New Blog</h1>
<p class="form-description" id="formDescription">
    Write your story and share it with the world.
</p>

            <label for="title">Blog Title</label>
            <input
                type="text"
                id="title"
                placeholder="Enter your blog title"
                required
            >

            <label for="category">Category</label>
            <select id="category" required>
                <option value="Technology">Technology</option>
                <option value="Programming">Programming</option>
                <option value="Education">Education</option>
                <option value="Personal Growth">Personal Growth</option>
                <option value="Lifestyle">Lifestyle</option>
                <option value="General">General</option>
            </select>

            <label for="content">Blog Content</label>
            <textarea
                id="content"
                rows="12"
                placeholder="Write your blog here..."
                required
            ></textarea>

            <p class="form-message" id="createBlogMessage"></p>

            <button type="submit" class="primary-button full-button" id="publishButton">
    Publish Blog
</button>
        </form>
    </main>

</body>
</html>
