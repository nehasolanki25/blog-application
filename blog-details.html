<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Details | BlogSpace</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body data-page="blog-details">

    <header class="navbar">
        <a href="index.html" class="logo">BlogSpace<span>.</span></a>

        <nav>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="create-blog.html">Write Blog</a>
        </nav>
    </header>

    <main class="details-section">
        <a href="index.html#blogs" class="back-link">
            ← Back to Blogs
        </a>

        <article class="details-card">
            <p class="category" id="detailCategory">Loading...</p>
            <h1 id="detailTitle">Loading blog...</h1>

            <p class="author" id="detailAuthor"></p>
            <p class="detail-date" id="detailDate"></p>

            <div class="detail-divider"></div>

            <div class="detail-content" id="detailContent"></div>

            <p class="status-message" id="detailsMessage"></p>
        </article>
    </main>

    <footer>
        <p>© 2026 BlogSpace. Built for curious minds.</p>
    </footer>

</body>
</html>
