<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | BlogSpace</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body data-page="dashboard">

    <header class="navbar">
        <a href="index.html" class="logo">BlogSpace<span>.</span></a>

        <nav>
            <a href="index.html">Home</a>
            <a href="create-blog.html">Write Blog</a>
            <button class="nav-link-button" id="logoutButton">Logout</button>
        </nav>
    </header>

    <main class="dashboard-section">
        <section class="blogs-section dashboard-blogs">
    <div class="section-heading">
        <div>
            <p class="eyebrow">YOUR WRITING</p>
            <h2>My Blogs</h2>
        </div>
    </div>

    <div class="blog-filters">
        <input
            type="search"
            id="searchBlogs"
            placeholder="Search your blogs..."
        >

        <select id="filterCategory">
            <option value="">All Categories</option>
            <option value="Technology">Technology</option>
            <option value="Programming">Programming</option>
            <option value="Education">Education</option>
            <option value="Personal Growth">Personal Growth</option>
            <option value="Lifestyle">Lifestyle</option>
            <option value="General">General</option>
        </select>
    </div>

    <p class="status-message" id="dashboardMessage"></p>
    <div class="blog-grid" id="myBlogs"></div>
</section>
    </main>

    <footer>
        <p>© 2026 BlogSpace. Built for curious minds.</p>
    </footer>

</body>
</html>
