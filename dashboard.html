<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | BlogSpace</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body data-page="dashboard">

    <header class="navbar">
        <a href="index.html" class="logo">BlogSpace<span>.</span></a>

        <nav>
            <a href="index.html">Home</a>
            <a href="create-blog.html">Write Blog</a>
            <button class="nav-link-button" id="logoutButton">Logout</button>
        </nav>
    </header>

    <main class="dashboard-section">
       
<section class="dashboard-welcome">
    <p class="eyebrow">YOUR PERSONAL SPACE</p>

    <h1>Welcome, <span id="userName">Writer</span>!</h1>

    <p>Manage your stories and share new ideas.</p>

    <a href="create-blog.html" class="primary-button">
        + Create New Blog
    </a>
</section>

<section class="profile-section">
    <div class="profile-card">
        <p class="eyebrow">YOUR PROFILE</p>

        <h2>Account Information</h2>

        <p>
            <strong>Name:</strong>
            <span id="profileName">Loading...</span>
        </p>

        <p>
            <strong>Email:</strong>
            <span id="profileEmail">Loading...</span>
        </p>

        <button
            type="button"
            class="delete-button"
            id="profileLogoutButton"
        >
            Logout
        </button>
    </div>
</section>

    </main>

    <footer>
        <p>© 2026 BlogSpace. Built for curious minds.</p>
    </footer>

</body>
</html>
